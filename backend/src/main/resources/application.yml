spring:
  application:
    name: formation-api
  datasource:
    # Dev : H2 fichier local. En test/prod : profil "prod" (PostgreSQL).
    url: jdbc:h2:file:./data/formation;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
  threads:
    virtual:
      enabled: true
  # Migrations de schema versionnees : actives en production (profil prod), le developpement reste en ddl-auto=update.
  flyway:
    enabled: false

server:
  # PaaS (Railway, Render...) : port fourni par la variable PORT
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,text/vtt,image/svg+xml,application/manifest+json
    min-response-size: 1024
  error:
    include-message: always
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        # docker-compose : health,prometheus sur un port interne (MANAGEMENT_SERVER_PORT=8081), jamais publie
        include: ${APP_ACTUATOR_EXPOSE:health}
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: formation-api
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  structured:
    format:
      # ecs = journaux JSON (Elastic Common Schema) pour une collecte centralisee ; vide = texte lisible
      console: ${LOG_FORMAT:}

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:4200}
  relay:
    # Mode serveur relais : URL du serveur central (vide = serveur central normal)
    central-url: ${APP_RELAY_CENTRAL_URL:}
    dir: ${APP_RELAY_DIR:./data/relay}
  sso:
    # SSO OpenID Connect (Keycloak, Entra ID, Google...). Vide : connexion par e-mail et mot de passe seulement.
    issuer-uri: ${SSO_ISSUER_URI:}
    client-id: ${SSO_CLIENT_ID:}
    client-secret: ${SSO_CLIENT_SECRET:}
    label: ${SSO_LABEL:Connexion institutionnelle}
    default-audience: ${SSO_DEFAULT_AUDIENCE:ENSEIGNANT}
    default-country: ${SSO_DEFAULT_COUNTRY:BJ}
  payment:
    fedapay:
      # Cle secrete FedaPay (sk_sandbox_... en test, sk_live_... en production). Vide : paiement en ligne indisponible.
      secret-key: ${FEDAPAY_SECRET_KEY:}
      environment: ${FEDAPAY_ENV:sandbox}
      webhook-secret: ${FEDAPAY_WEBHOOK_SECRET:}
  mail:
    # Expediteur des e-mails (reinitialisation du mot de passe). SMTP : SPRING_MAIL_HOST, SPRING_MAIL_PORT...
    from: ${APP_MAIL_FROM:no-reply@formation.local}
  jwt:
    # A remplacer en test/prod via la variable APP_JWT_SECRET (>= 32 caracteres)
    secret: ${APP_JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
    validity-days: 30
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:4200}
  media:
    dir: ${APP_MEDIA_DIR:./data/media}
  seed:
    demo-data: true
    admin-password: ${APP_ADMIN_PASSWORD:Admin123!}
  ai:
    enabled: ${APP_AI_ENABLED:true}
    # Vide : identifiants lus dans l'environnement (ANTHROPIC_API_KEY...). Sans identifiants : mode local.
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${APP_AI_MODEL:claude-opus-5-5}
  badges:
    # Cle RSA privee (JWK JSON) de signature des Open Badges ; vide = generee une fois et conservee en base
    signing-jwk: ${APP_BADGES_SIGNING_JWK:}
  brand:
    # Nom et signataires imprimes sur les certificats (charte du client)
    name: ${APP_BRAND_NAME:Plateforme de formation - démonstration}
    organization: ${APP_BRAND_ORGANIZATION:}
    primary: "${APP_BRAND_PRIMARY:#2f7d4f}"
    accent: "${APP_BRAND_ACCENT:#f5c400}"
    signatory1: ${APP_SIGNATORY1:Responsable pédagogique}
    signatory1-role: ${APP_SIGNATORY1_ROLE:Coordination pédagogique}
    signatory2: ${APP_SIGNATORY2:Direction du programme}
    signatory2-role: ${APP_SIGNATORY2_ROLE:En partenariat avec le ministère de l'éducation}

---
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    enabled: true
    # base existante creee avant les migrations : marquee comme V1 sans rejouer le script
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # le schema est gere par Flyway : Hibernate verifie seulement qu'il correspond aux entites
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/formation}
    username: ${DB_USER:formation}
    password: ${DB_PASSWORD}
  h2:
    console:
      enabled: false
app:
  seed:
    demo-data: ${APP_SEED_DEMO:false}
