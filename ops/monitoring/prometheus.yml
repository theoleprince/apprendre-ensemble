global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # API Spring Boot : port de gestion interne (non publie, non proxifie)
  - job_name: formation-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:8081']
