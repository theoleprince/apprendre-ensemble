groups:
  - name: formation-api
    rules:
      - alert: ApiInjoignable
        expr: up{job="formation-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "L'API ne repond plus depuis 2 minutes"

      - alert: TauxErreursServeur
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1) > 0.02
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Plus de 2 % de reponses 5xx sur 5 minutes"

      - alert: LatenceP95Elevee
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{uri!~"/api/assistant.*"}[5m]))) > 1.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "p95 des requetes API > 1,5 s depuis 10 minutes"

      - alert: PoolConnexionsSature
        expr: hikaricp_connections_pending > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Des requetes attendent une connexion a la base"

      - alert: MemoireJvm
        expr: sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Tas Java utilise a plus de 90 %"

      - alert: ConnexionsRefuseesEnRafale
        expr: sum(rate(http_server_requests_seconds_count{uri="/api/auth/login",status="429"}[5m])) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Tentatives de connexion bloquees en rafale (force brute probable)"
