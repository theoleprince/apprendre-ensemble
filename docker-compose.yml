name: formation

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: formation
      POSTGRES_USER: formation
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formation -d formation"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/formation
      DB_USER: formation
      DB_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET manquant dans .env}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?APP_ADMIN_PASSWORD manquant dans .env}
      APP_SEED_DEMO: ${APP_SEED_DEMO:-true}
      APP_CORS_ORIGINS: ""
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
      APP_MEDIA_DIR: /data/media
      # Assistant IA : sans cle, mode local (recherche dans les contenus)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      APP_AI_MODEL: ${APP_AI_MODEL:-claude-opus-5-5}
      APP_BRAND_NAME: ${APP_BRAND_NAME:-Plateforme de formation - démonstration}
    volumes:
      - media:/data/media

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  db-data:
  media:
