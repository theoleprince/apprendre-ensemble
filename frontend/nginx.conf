# Conserve l'hote et le schema vus par le navigateur, y compris derriere un proxy TLS en amont :
# Spring compare l'en-tete Origin a l'hote reel (sinon la requete est prise pour du cross-origin -> 403).
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_x_forwarded_host $fwd_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Compression : important sur les reseaux 2G/3G
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 512;

    client_max_body_size 210m;
    server_tokens off;
    include /etc/nginx/security-headers.conf;

    # API Spring Boot (meme origine : pas de CORS en test/prod)
    location ^~ /api/ {
        # resolution DNS dynamique : un backend recree (nouvelle IP) reste joignable sans redemarrer nginx
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 300s;
        # Streaming de l'assistant IA (SSE) : pas de mise en tampon
        proxy_buffering off;
        proxy_cache off;
    }

    # Fichiers du service worker : jamais en cache HTTP (sinon les mises a jour ne passent pas)
    location ~ ^/(ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Fichiers versionnes (hash dans le nom) : cache long
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Routes Angular
    location / {
        try_files $uri $uri/ /index.html;
    }
}
