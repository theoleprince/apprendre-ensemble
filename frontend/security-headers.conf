# En-tetes de securite (inclus dans chaque location : nginx n'herite pas des add_header).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;
# HSTS : actif uniquement derriere HTTPS (le proxy TLS amont le transmet)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# CSP : aucun script en ligne ; medias et images locaux (blob: pour la lecture hors ligne) ; visio et paiement par liens externes
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
